name: C++ CI (Docker Build Environment)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: dhanushshankar/cpp:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure project
        run: |
          cmake -S . -B build

      - name: Build project
        run: |
          cmake --build build